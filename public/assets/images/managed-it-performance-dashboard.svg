<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Illustrative managed IT performance dashboard</title>
  <desc id="description">Sample dashboard with illustrative uptime, incident resolution, ticket volume, SLA, security alert, and infrastructure health metrics. Not customer or GulfStream performance data.</desc>
  <rect x="1" y="1" width="1598" height="898" rx="28" fill="#0B172B" stroke="#314C6B" stroke-width="2"/>
  <rect x="38" y="38" width="1524" height="824" rx="22" fill="#10233D"/>
  <path d="M38 60C38 47.85 47.85 38 60 38H1540C1552.15 38 1562 47.85 1562 60V144H38V60Z" fill="#17375F"/>
  <circle cx="88" cy="91" r="12" fill="#FF6B35"/>
  <circle cx="125" cy="91" r="12" fill="#F6C453"/>
  <circle cx="162" cy="91" r="12" fill="#54D6A0"/>
  <text x="218" y="103" fill="#EAF2FF" font-family="Arial, sans-serif" font-size="29" font-weight="700">IT OPERATIONS OVERVIEW</text>
  <rect x="1123" y="72" width="376" height="43" rx="21" fill="#1D4268"/>
  <text x="1311" y="100" fill="#FFB28C" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">ILLUSTRATIVE SAMPLE DATA ONLY</text>
  <g font-family="Arial, sans-serif">
    <g>
      <rect x="72" y="188" width="455" height="205" rx="18" fill="#142B49" stroke="#31577F" stroke-width="2"/>
      <text x="105" y="235" fill="#B7CAE0" font-size="20">System uptime</text>
      <text x="105" y="306" fill="#FFFFFF" font-size="50" font-weight="700">99.95%</text>
      <rect x="105" y="340" width="375" height="10" rx="5" fill="#294968"/>
      <rect x="105" y="340" width="340" height="10" rx="5" fill="#54D6A0"/>
      <text x="105" y="375" fill="#8FAAC7" font-size="15">Example measure — define target per service</text>
    </g>
    <g>
      <rect x="572" y="188" width="455" height="205" rx="18" fill="#142B49" stroke="#31577F" stroke-width="2"/>
      <text x="605" y="235" fill="#B7CAE0" font-size="20">Incident resolution time</text>
      <text x="605" y="306" fill="#FFFFFF" font-size="50" font-weight="700">2.4 hrs</text>
      <path d="M605 354H984" stroke="#294968" stroke-width="8" stroke-linecap="round"/>
      <path d="M605 354H820" stroke="#58AEFF" stroke-width="8" stroke-linecap="round"/>
      <text x="605" y="375" fill="#8FAAC7" font-size="15">Illustrative sample — not a service commitment</text>
    </g>
    <g>
      <rect x="1072" y="188" width="455" height="205" rx="18" fill="#142B49" stroke="#31577F" stroke-width="2"/>
      <text x="1105" y="235" fill="#B7CAE0" font-size="20">Support tickets</text>
      <text x="1105" y="306" fill="#FFFFFF" font-size="50" font-weight="700">28</text>
      <g fill="#58AEFF">
        <rect x="1260" y="306" width="25" height="49" rx="6"/>
        <rect x="1301" y="280" width="25" height="75" rx="6"/>
        <rect x="1342" y="296" width="25" height="59" rx="6"/>
        <rect x="1383" y="260" width="25" height="95" rx="6"/>
        <rect x="1424" y="287" width="25" height="68" rx="6"/>
        <rect x="1465" y="270" width="25" height="85" rx="6"/>
      </g>
      <text x="1105" y="375" fill="#8FAAC7" font-size="15">Illustrative volume — review by priority and trend</text>
    </g>
    <g>
      <rect x="72" y="428" width="455" height="205" rx="18" fill="#142B49" stroke="#31577F" stroke-width="2"/>
      <text x="105" y="475" fill="#B7CAE0" font-size="20">SLA compliance</text>
      <text x="105" y="546" fill="#FFFFFF" font-size="50" font-weight="700">97%</text>
      <circle cx="431" cy="521" r="54" stroke="#294968" stroke-width="15"/>
      <path d="M431 467A54 54 0 1 1 382 543" stroke="#FF8C52" stroke-width="15" stroke-linecap="round"/>
      <text x="105" y="600" fill="#8FAAC7" font-size="15">Illustrative sample — report definitions matter</text>
    </g>
    <g>
      <rect x="572" y="428" width="455" height="205" rx="18" fill="#142B49" stroke="#31577F" stroke-width="2"/>
      <text x="605" y="475" fill="#B7CAE0" font-size="20">Security alerts</text>
      <text x="605" y="546" fill="#FFFFFF" font-size="50" font-weight="700">3</text>
      <circle cx="927" cy="514" r="45" fill="#FF6B35" fill-opacity=".16"/>
      <path d="M927 479L955 490V514C955 535 943 550 927 560C911 550 899 535 899 514V490L927 479Z" stroke="#FF9A64" stroke-width="6"/>
      <path d="M914 515L923 524L941 504" stroke="#FF9A64" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="605" y="600" fill="#8FAAC7" font-size="15">Illustrative count — alert severity is context-dependent</text>
    </g>
    <g>
      <rect x="1072" y="428" width="455" height="205" rx="18" fill="#142B49" stroke="#31577F" stroke-width="2"/>
      <text x="1105" y="475" fill="#B7CAE0" font-size="20">Infrastructure health</text>
      <text x="1105" y="546" fill="#FFFFFF" font-size="50" font-weight="700">92%</text>
      <path d="M1295 553L1335 525L1371 537L1416 486L1468 510" stroke="#58AEFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1295 572H1482" stroke="#294968" stroke-width="3"/>
      <text x="1105" y="600" fill="#8FAAC7" font-size="15">Illustrative composite — define monitored signals</text>
    </g>
  </g>
  <text x="800" y="713" fill="#FFB28C" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Illustrative dashboard sample only — not customer or GulfStream Technologies performance data</text>
  <text x="800" y="756" fill="#8FAAC7" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Actual measures, targets, service levels, and reporting depend on the environment and agreed scope.</text>
</svg>
